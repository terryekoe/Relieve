name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Download offline Bible database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources"
          Invoke-WebRequest -Uri "https://github.com/terryekoe/Relieve/releases/download/v1.0.0/bible.db" -OutFile "src-tauri/resources/bible.db"
          Get-Item "src-tauri/resources/bible.db"

      - name: Build Windows Tauri package
        run: npm run tauri build

      - name: Upload Windows Installers to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          if (-not $tag -or $tag -eq "main") { $tag = "v1.0.0" }
          Write-Host "Publishing Windows installer assets to release: $tag"
          
          $exeFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue

          foreach ($f in $exeFiles) {
              Write-Host "Uploading $($f.FullName)..."
              gh release upload $tag $f.FullName --clobber
          }
          foreach ($f in $msiFiles) {
              Write-Host "Uploading $($f.FullName)..."
              gh release upload $tag $f.FullName --clobber
          }
